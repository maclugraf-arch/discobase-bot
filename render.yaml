services:
  - type: web
    name: discobase-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: "*"
